<h2>Listado de Personajes</h2>

<table border="1" cellpadding="5">
  <thead>
    <tr>
      <th>Nombre</th>
      <th>Rol</th>
      <th>Serie</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let p of personajes">
      <td>{{ p.nombre }}</td>
      <td>{{ p.rol }}</td>
      <td>{{ p.serie?.nombre }}</td>
    </tr>
  </tbody>
</table>
